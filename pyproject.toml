[project]
name = "nebius-reel"
version = "0.1.0"
description = "Grounded research to editable educational reels"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["backend/core/tests"]
